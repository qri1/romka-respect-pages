name: Publish GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Unpack prepared site
        env:
          SITE_ARCHIVE: ${{ secrets.SITE_ARCHIVE }}
        run: |
          test -n "$SITE_ARCHIVE"
          mkdir site
          printf '%s' "$SITE_ARCHIVE" | base64 --decode | tar -xz -C site
          test -f site/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
